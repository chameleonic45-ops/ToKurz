function extra(){
  const g=el('a','btn main','🌷 มีของเล็ก ๆ ฝากไว้ให้');g.href=GIFT_URL;g.target='_blank';g.rel='noopener';
  g.style.cssText='display:block;text-align:center;text-decoration:none;padding:13px 16px;margin-top:10px;border-radius:999px;color:#fff;font-weight:500;background:linear-gradient(90deg,#2f80ff,#4fb6ff);box-shadow:0 6px 18px rgba(47,128,255,.4)';
  card.append(g);
  const c=el('button','','คัดลอกคำตอบของฉัน');c.onclick=async()=>{try{await navigator.clipboard.writeText(summary());c.textContent='คัดลอกแล้ว'}catch(e){c.textContent='คัดลอกไม่ได้ในเครื่องนี้'}};card.append(c);
}

function renderEnvelope(s){
  card.innerHTML='';card.classList.remove('fade');void card.offsetWidth;card.classList.add('fade');
  card.append(el('div','tag',s.tag));
  const env=el('div','env');
  const body=el('div','body');
  body.append(el('div','cover',s.title),el('div','hint','แตะเพื่อเปิดจดหมาย'));
  env.append(body,el('div','flap'));
  env.onclick=()=>{
    if(env.classList.contains('open'))return;
    env.classList.add('open');playMusic();
    setTimeout(()=>{env.style.display='none';showLetter(s)},900);
  };
  card.append(env);
  const yl=el('a','','▶ ฟังเพลงบน YouTube');yl.href='https://www.youtube.com/watch?v='+YT_ID;yl.target='_blank';yl.rel='noopener';yl.style.cssText='display:block;text-align:center;margin-top:12px;color:#2f80ff;font-size:15px;text-decoration:none';card.append(yl);
}

function showLetter(s){
  const wrap=el('div');
  wrap.append(el('h1','',s.letterTitle||''));
  s.text.split('\n\n').filter(Boolean).forEach((t,i)=>{const p=el('p','rise',t);p.style.animationDelay=(0.3+i*0.6)+'s';wrap.append(p)});
  const sg=el('div','sign rise',s.from);sg.style.animationDelay=(0.6+s.text.split('\n\n').length*0.6)+'s';wrap.append(sg);
  const b=el('button','main',s.btn);b.onclick=()=>nav(s.next);
  b.style.opacity='0';b.style.animation='up .6s ease forwards';b.style.animationDelay=(1+s.text.split('\n\n').length*0.6)+'s';
  wrap.append(b);
  card.append(wrap);
}

function go(id){
  cur=id;
  const s=S[id];
  if(s.envelope){renderEnvelope(s);return}
  card.innerHTML='';card.classList.remove('fade');void card.offsetWidth;card.classList.add('fade');
  card.append(el('div','tag',s.tag));if(s.title)card.append(el('h1','',s.title));
  if(s.note)card.append(el('p','note',s.note));
  (s.text||'').split('\n\n').filter(Boolean).forEach(t=>card.append(el('p','',t)));
  if(s.opts){s.opts.forEach(o=>{const b=el('button','',o[0]);b.onclick=()=>{ans[id]={q:s.title,a:o[0]};save();nav(o[1])};card.append(b)})}
  else if(s.input){const t=document.createElement('textarea');t.rows=4;t.placeholder='พิมพ์ตรงนี้ได้เลยครับ';card.append(t);const b=el('button','main',s.btn);b.onclick=()=>{ans[id]={q:s.title,a:t.value.trim()||'(ไม่ได้พิมพ์)'};save();nav(s.next)};card.append(b)}
  else{if(s.extra)extra();const b=el('button',s.ghost?'':'main',s.btn);b.onclick=()=>nav(s.next);card.append(b)}
  if(stack.length){const bk=el('button','back','← ย้อนกลับ');bk.onclick=back;card.append(bk)}
  window.scrollTo(0,0);
}

go('m1');

const yt=document.getElementById('yt'),pp=document.getElementById('pp'),vol=document.getElementById('vol');
yt.referrerPolicy='strict-origin-when-cross-origin';
yt.src='https://www.youtube.com/embed/'+YT_ID+'?autoplay=1&loop=1&playlist='+YT_ID+'&playsinline=1&rel=0';
let playing=false;
function cmd(f,a){try{yt.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:a||[]}),'*')}catch(e){}}
pp.onclick=e=>{e.stopPropagation();const a=document.getElementById('snd');if(a.paused){a.play();playing=true;pp.textContent='⏸'}else{a.pause();playing=false;pp.textContent='▶'}};
vol.oninput=()=>{document.getElementById('snd').volume=+vol.value/100};
(async()=>{try{if(window.claude)db=await claude.use('db')}catch(e){}})();
</script>
</body>
